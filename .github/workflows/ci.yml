# Runs the Swift package tests, the offline type-check, and the iOS 26 build and Simulator UI tests; no job signs, installs on a device, or contacts myQ.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - run: script/test
      - run: script/typecheck
      - run: script/sanitize

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - run: brew install xcodegen
      - run: script/ci-ios
        env:
          CI_OUTPUT_DIR: ${{ runner.temp }}/ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-results
          path: |
            ${{ runner.temp }}/ci/*.log
            ${{ runner.temp }}/ci/*.txt
            ${{ runner.temp }}/ci/*.png
            ${{ runner.temp }}/ci/UITests.xcresult
          if-no-files-found: ignore
          # The UI tests run in the signed-out sandbox, so these hold only simulator data; they still expire after a week.
          retention-days: 7
