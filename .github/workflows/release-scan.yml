# Defense in depth behind the per-PR scan: scans every branch and tag plus the working tree with the App Check debug-token rule.
name: Release scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  all-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch every branch and tag
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*' && git fetch --tags origin
      - name: Install gitleaks
        run: script/install-gitleaks "$RUNNER_TEMP"
      - name: Prove the debug-token rule still catches fake tokens
        run: script/check-gitleaks-rule "$RUNNER_TEMP/gitleaks"
      - name: Scan all refs
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .github/gitleaks-release.toml --log-opts="--all" .'
      - name: Scan the working tree
        run: '"$RUNNER_TEMP/gitleaks" dir --no-banner --redact --config .github/gitleaks-release.toml .'
