# Checks the patched vendor/gatectl offline on every supported Python; nothing here logs in, contacts myQ, moves a door, or runs script/install.
name: gatectl

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Audit tools are pinned to the versions recorded in docs/gatectl-security-review.md.
      - run: python -m pip install ruff==0.16.10 detect-secrets==1.5.0
      - name: Static checks
        working-directory: vendor/gatectl
        run: |
          ruff format --check src tests
          ruff check src tests
      - name: Secret scan of the vendored tree
        working-directory: vendor/gatectl
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Bytecode compilation
        working-directory: vendor/gatectl
        run: python -m compileall -q src tests
      - name: Offline tests and CLI smoke test
        run: PYTHON=python script/gatectl-test
      - name: Phase 2 session wrapper tests
        run: python -m unittest discover -s script/tests
      - name: Targeted mutation check
        if: matrix.python-version == '3.13'
        run: python script/gatectl_mutants.py

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan history and tree with gitleaks 8.30.1
        run: |
          script/install-gitleaks "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact .
