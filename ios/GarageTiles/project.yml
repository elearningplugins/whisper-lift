# XcodeGen spec; run `xcodegen generate` in this directory to create the gitignored GarageTiles.xcodeproj.
name: GarageTiles
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GarageTilesKit:
    path: GarageTilesKit
targets:
  GarageTiles:
    type: application
    platform: iOS
    sources:
      - GarageTiles
      - Shared
    dependencies:
      - package: GarageTilesKit
        product: GarageDoorKit
    info:
      path: GarageTiles/Info.plist
      properties:
        CFBundleDisplayName: Whisper Lift
        # Filled from the ignored config/MyQ.local.xcconfig; only the app's sign-in reads it.
        MyQAppCheckDebugToken: "$(MYQ_APP_CHECK_DEBUG_TOKEN)"
        # Atkinson Hyperlegible Next from the app design, SIL Open Font License 1.1 (GarageTiles/Fonts/OFL-AtkinsonHyperlegibleNext.txt).
        UIAppFonts:
          - AtkinsonHyperlegibleNext-Regular.ttf
          - AtkinsonHyperlegibleNext-SemiBold.ttf
          - AtkinsonHyperlegibleNext-Bold.ttf
        GarageTilesKeychainGroup: "$(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).GarageTiles"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GarageTilesAppGroup: "$(GARAGE_TILES_APP_GROUP)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: GarageTiles/GarageTiles.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(GARAGE_TILES_APP_GROUP)"
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).GarageTiles"
    settings:
      base:
        PRODUCT_NAME: GarageTiles
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).GarageTiles"
        # The "hungry garage" icon from the logo sheet, a single 1024 px image in GarageTiles/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GarageTilesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GarageTilesUITests
    dependencies:
      - target: GarageTiles
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_ID_PREFIX).GarageTiles.UITests"
schemes:
  GarageTiles:
    build:
      targets:
        GarageTiles: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GarageTilesUITests
